rm_tracker:
  ros__parameters:
    # ------------------------ NODE -----------------------
    log_throttle_ms: 1000

    follow_decision: true # 是否跟随决策节点的颜色选择

    # 陀螺仪到相机 (IMU -> Cam) 旋转标定
    rotation_rpy_r: 0.0
    rotation_rpy_p: 0.0
    rotation_rpy_y: -180.0

    show_rpy: false # 是否打印 IMU 调试信息
    debug: false
    display_fps_limit: true
    display: false # 是否显示 OpenCV 调试图像

    # ----------------------- TRACKER ---------------------
    target_color: 0 # 0: RED, 1: BLUE (当前要打的敌人颜色)

    # [外参] 相机 -> 枪口 (Camera to Gun) (x:右, y:下, z:前)
    # 注意：单位是米 (m) 和 弧度 (rad)
    cam_to_gun_pos_x: 0.000 # 你的代码默认是 10.0，建议改为实际测量值，例如 0.0
    cam_to_gun_pos_y: 0.00 # 假设相机在枪管上方 12cm
    cam_to_gun_pos_z: 0.05
    cam_to_gun_rpy_r: 0.0
    cam_to_gun_rpy_p: 0.0
    cam_to_gun_rpy_y: 0.0

    # [逻辑与阈值]
    dist_tol: 0.10 # 预处理：两块板距离容差 (m)
    max_match_distance: 0.2 # 匹配：最大距离阈值 (m)
    max_match_yaw_diff: 57.0 # 匹配：判定跳变的 Yaw 差值 (deg)
    jump_cooldown_max: 20
    tracking_thres: 5 # 连续检测帧数 (进入 TRACKING) - int
    lost_thres: 20 # 连续丢失帧数 (进入 LOST) - int

    # [EKF Q/R 参数] — 连续白噪声离散化 (Q_pos = q*dt³/3, Q_vel = q*dt, Q_r = q*dt)
    ekf_QR_q_xyz: 0.1 # 相对平移加速度谱密度 (m²/s³)，验证记录见 tracker README
    ekf_QR_q_yaw: 0.5 # 角加速度谱密度 (rad²/s³)
    ekf_QR_q_r: 0.000001 # 刚性车体几何的缓慢游走 (m²/s)

    ekf_QR_r_xyz_factor: 0.5 # PnP位置噪声：距离百分比(0.2=>0.2%)，R=(factor*dist+5mm)^2
    ekf_QR_r_depth_factor: 1.0 # 测深sigma=max(位置sigma, 0.005+factor*0.01*dist²)，0关闭
    ekf_QR_r_yaw: 0.02 # 角度方差；平面分支消歧后仍有像素/倾斜误差

    ekf_QR_stable_dist: 1.4

    # [车辆物理参数]
    radius_r_max: 0.4 # 车辆最大半径 (m)
    radius_r_min: 0.15 # 车辆最小半径 (m)

    system_delay: 0.01 # 图像/估计补偿秒数；不是实测延迟，不考虑则写0
    controller_delay: 0.02 # 执行补偿秒数；不是实测延迟，不考虑则写0

    # 反小陀螺
    max_spinning_frame: 10
    spinning_frame_lost: 5
    min_spinning_vel: 1.0

    # [发射参数]
    bullet_speed: 25.0 # 弹速 (m/s)

    # 发弹角度阈值
    min_hit_probability: 0.25 # 到达板面高斯近似概率门限；不代表实测命中率
    shootable_dist: 10.0
    distance_decress_ratio: 0.60
    yaw_tolerance_deg: 7.0 # 允许发射的 yaw 角度阈值
    pitch_tolerance_deg: 7.0 # 允许发射的 pitch 角度阈值

    text_size: 1.5
