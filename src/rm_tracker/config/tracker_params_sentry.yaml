rm_tracker:
  ros__parameters:
    # ------------------------ NODE -----------------------
    log_throttle_ms: 1000

    follow_decision: true # 是否跟随决策节点的颜色选择

    # 陀螺仪到相机 (IMU -> Cam) 旋转标定
    rotation_rpy_r: 0.0
    rotation_rpy_p: 0.0
    rotation_rpy_y: -180.0

    show_rpy: false # 是否打印 IMU 调试信息
    debug: false
    display_fps_limit: true
    display: false # 是否显示 OpenCV 调试图像
    debug_zero_yaw: false # 调试：发布 yaw 强制 0，只看前馈效果
    nav_visual_display: false # 是否发布 /tracker/enemy_nav_img 导航可视化图像

    # ----------------------- TRACKER ---------------------
    target_color: 1 # 0: RED, 1: BLUE (当前要打的敌人颜色)

    # [外参] 相机 -> 枪口 (Camera to Gun) (x:右, y:下, z:前)
    # 注意：单位是米 (m) 和 弧度 (rad)
    cam_to_gun_pos_x: 0.0515
    cam_to_gun_pos_y: 0.014
    cam_to_gun_pos_z: 0.0
    cam_to_gun_rpy_r: 0.0
    cam_to_gun_rpy_p: 0.1
    cam_to_gun_rpy_y: 1.3

    # [外参] 云台 yaw 轴 -> 相机光心 (Yaw axis to Camera) (x:前, y:右, z:上)
    # 量 yaw 轴到镜头光心的平移；光心在轴前方 10cm 就填 x: 0.10。
    # 只影响 EKF / 前馈 / 可视化，不影响瞄准弹道，标错了也不会打偏。
    yaw_to_cam_pos_x: 0.195
    yaw_to_cam_pos_y: 0.052
    yaw_to_cam_pos_z: 0.0

    # [逻辑与阈值]
    dist_tol: 0.10 # 预处理：两块板距离容差 (m)
    max_match_distance: 0.3 # 匹配：最大距离阈值 (m)
    max_match_yaw_diff: 57.0 # 匹配：判定跳变的 Yaw 差值 (deg)
    jump_cooldown_max: 20
    tracking_thres: 5 # 连续检测帧数 (进入 TRACKING) - int
    lost_thres: 40 # 连续丢失帧数 (进入 LOST) - int

    # [EKF Q/R 参数] — 连续白噪声离散化 (Q_pos = q*dt³/3, Q_vel = q*dt, Q_r = q*dt)
    # SPIN 下车心/板耦合强：q 略大、R 略小，避免预测锁死导致虚拟板乱飞（bag 扫参落地）
    # 最终选定(2026-10-21)：q_xyz=4 / r_xyz_factor=1 / keep=0.30 + 双板/射线软融合；
    # A/B/C 单卡与历史径向/合卡均未过门禁，见 bags/eval_spin_radial/RESULT.md
    ekf_QR_q_xyz: 4.0 # 加速度谱密度 (m²/s³) — 越大越信任观测
    ekf_QR_q_yaw: 2.0 # 角加速度谱密度 (rad²/s³)
    ekf_QR_q_r: 0.02 # 半径游走谱密度 (m²/s)

    ekf_QR_r_xyz_factor: 1.0 # PnP位置噪声：距离百分比(1.0=>1%)，R=(factor*dist+5mm)^2
    ekf_QR_r_yaw: 0.002 # Measurement Noise R: 角度方差

    ekf_QR_stable_dist: 1.4

    # [车辆物理参数]
    radius_r_max: 0.4 # 车辆最大半径 (m)
    radius_r_min: 0.15 # 车辆最小半径 (m)

    system_delay: 0.01
    # 云台额外滞后：只外推瞄准点，不参与选板/正对（对齐 FYT controller_delay）
    controller_delay: 0.02

    # yaw 前馈：目标瞄准点世界系视线角速度 (deg/s)
    yaw_rate_enable: true
    yaw_rate_sign: 1.0
    yaw_rate_lpf_hz: 30.0
    yaw_rate_max_deg_s: 720.0
    yaw_rate_max_accel_deg_s2: 1500.0
    yaw_rate_blend_time: 0.10
    yaw_rate_hold_after_reset: 0.10
    # yaw 前馈软死区：|ff|<=dz 输出 0，dz..dz+ramp 线性恢复；dz=0 关闭
    yaw_rate_deadzone_deg_s: 8.0
    yaw_rate_deadzone_ramp_deg_s: 4.0

    # 反小陀螺 — 时间累计 (秒), 帧率无关
    min_spinning_vel: 0.7 # 角速度门限 (rad/s)
    spin_enter_time: 0.3 # 进入小陀螺判定所需累计时间 (s)
    spin_exit_time: 0.15 # 退出小陀螺判定所需累计时间 (s)

    k_v2: 0.019 # 平方空气阻力系数

    # [发射参数]
    bullet_speed: 25.0 # 弹速 (m/s)

    # 发弹角度阈值
    shootable_dist: 10.0
    distance_decress_ratio: 0.60
    yaw_tolerance_deg: 10.0 # 允许发射的 yaw 角度阈值
    pitch_tolerance_deg: 10.0 # 允许发射的 pitch 角度阈值

    text_size: 2.0
