rm_detector:
  ros__parameters:
    cls_model_file: 'RM_Armor_CNN_sim.onnx'   # 文件名

    # ---- 灯条过滤参数 ----
    light_area_min: 5
    light_h_w_ratio: 2.0
    light_angle_min: -35
    light_angle_max: 35
    light_red_ratio: 1.0
    light_blue_ratio: 1.0

    # ---- 装甲板匹配参数 ----
    height_rate_tol: 1.8
    height_multiplier_min: 1.0
    height_multiplier_max: 3.0
    roi_crop: false
    roi_scale: 0.4
    row_stretch: 2.22
    col_stretch: 0.7

    # ---- 图像处理参数 ----
    binary_val: 120
    detect_color: 2
    display_mode: false

    # ---- 其他参数 ----
    use_geometric_center: true
    print_period_ms: 1000

    # ---- 后置 USB 相机（仅检测有无目标，供云台转 yaw）----
    enable_rear_camera: true
    rear_image_topic: '/usb_camera/image_raw'
    rear_camera_info_topic: '/usb_camera/camera_info'
    rear_max_age_ms: 300        # 后帧超过此年龄视为失效，不参与兜底
    front_max_gap_ms: 500       # 前帧断流超过此时长则直接用后帧; <=0 = 禁用

    # 后相机 -> 前相机(云台) 静态外参: RPY(度) + 平移(mm)
    # 光学系 Z前/X右/Y下; 后置相机绕垂直轴(Y)转180° => pitch=180
    rear_ext_xyz_mm: [0.0, 0.0, 0.0]
    rear_ext_rpy_deg: [0.0, 180.0, 0.0]
